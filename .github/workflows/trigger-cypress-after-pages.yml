name: Trigger Cypress Repo After Pages Deploy

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

jobs:
  trigger-cypress:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cypress workflow in target repo
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.CROSS_REPO_ACTIONS_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alexbashchuk/TypeScript-Cypress-CICD/actions/workflows/run-cypress-after-portfolio.yml/dispatches \
            -d '{
              "ref":"main",
              "inputs":{
                "source_repo":"'"${{ github.repository }}"'",
                "source_sha":"'"${{ github.event.workflow_run.head_sha }}"'"
              }
            }'